name: clinicapp
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_local_only
      POSTGRES_DB: clinicapp
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinicapp"]
      interval: 3s
      timeout: 3s
      retries: 30
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: clinic_local
      MINIO_ROOT_PASSWORD: clinic_local_storage_only
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["objects:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:58025:8025"]
  scanner:
    image: clamav/clamav:1.4.3
    ports: ["127.0.0.1:53310:3310"]
    volumes: ["clamdata:/var/lib/clamav"]
volumes:
  pgdata:
  objects:
  clamdata:
